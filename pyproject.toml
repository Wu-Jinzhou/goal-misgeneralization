[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkworld-goals"
version = "0.1.0"
description = "Controlled, hypothesis-driven experiments for AI goal misgeneralization"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "ForkWorld contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
llm = [
  "accelerate>=1.2,<2",
  "huggingface-hub>=0.27,<2",
  "peft>=0.14,<1",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "tokenizers>=0.21,<1",
  "transformers>=4.48,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
forkworld = "forkworld.cli:main"
goalzendo = "goalzendo.cli:main"
goalzendo-g00e = "goalzendo_g00e.cli:main"
goalzendo-g00f = "goalzendo_g00f.cli:main"
goalzendo-zendo = "goalzendo_interactive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forkworld = ["py.typed"]
goalzendo = ["py.typed"]
goalzendo_g00e = ["py.typed", "bridge_manifest.json"]
goalzendo_g00f = ["py.typed", "source_manifest.json"]
goalzendo_interactive = ["py.typed"]
goalzendo_interactive_v2 = ["py.typed"]
goalzendo_hidden_law = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["forkworld", "goalzendo", "goalzendo_g00e", "goalzendo_g00f", "goalzendo_interactive", "goalzendo_interactive_v2", "goalzendo_hidden_law"]
warn_unused_ignores = true
no_implicit_optional = true
