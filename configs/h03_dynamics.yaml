extends: base.yaml

experiment:
  hypothesis: h3
  name: easy_to_hard_dynamics
  mode: dense_checkpointing

h3:
  reward_plateau_tolerance: 0.005
  reward_plateau_window: 4

train:
  steps: 8192
  eval_steps: log

sweep:
  data.q: [0.6, 0.8, 0.9, 0.95, 0.99]
  data.k: [2, 3, 4, 5]
  data.n_train: [1000, 4000, 16000]
  model.width: [16, 32, 64, 128]
