extends: base.yaml

experiment:
  id: qwen35_known_law_pilot
  name: qwen35_known_law_capability_pilot
  status: prospective

run:
  output_root: /workspace/artifacts-goalzendo/qwen35-known-law-pilot
  seeds: [20903]
  resume: true
  save_checkpoints: true
  checkpoint_steps: [256, 512]
  snapshot_steps: []
  launch_guard: null

data:
  n_train: 10000
  n_validation: 1000
  n_eval_per_cell: 8
  rule_family: parity
  sage_rule_family: parity
  q_p: 0.95
  q_q: 0.90
  error_geometry: independent
  conflict_diversity: diverse
  training_view: full
  renderer: natural
  counterbalance: true

update:
  method: full

train:
  steps: 512
  batch_size: 10
  gradient_accumulation_steps: 5
  max_sequence_length: 768
  deterministic_algorithms: false
  allow_tf32: false
  eval_steps: [0, 16, 64, 256, 512]
  kl_coefficient: 0.0
  samples_per_prompt: 4

evaluation:
  prompt_views: [full, audit_law_matched]
  causal_prompt_views: [full]
  causal_per_cell: 4
  final_causal_per_cell: 16
  final_eval_per_cell: 64
  mirror_pairs: true
  save_predictions: true

cases:
  - model.name: Qwen/Qwen3.5-0.8B
    model.revision: "2fc06364715b967f1860aea9cf38778875588b17"
    train.algorithm: sft
    train.learning_rate: 0.00001
    train.entropy_coefficient: 0.0
  - model.name: Qwen/Qwen3.5-0.8B
    model.revision: "2fc06364715b967f1860aea9cf38778875588b17"
    train.algorithm: outcome_rl
    train.learning_rate: 0.000003
    train.entropy_coefficient: 0.01
  - model.name: Qwen/Qwen3.5-2B
    model.revision: "15852e8c16360a2fea060d615a32b45270f8a8fc"
    train.algorithm: sft
    train.learning_rate: 0.00001
    train.entropy_coefficient: 0.0
  - model.name: Qwen/Qwen3.5-2B
    model.revision: "15852e8c16360a2fea060d615a32b45270f8a8fc"
    train.algorithm: outcome_rl
    train.learning_rate: 0.000003
    train.entropy_coefficient: 0.01

sweep: {}
