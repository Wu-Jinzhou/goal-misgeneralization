extends: g00_engineering.yaml

experiment:
  id: g00
  name: adaptive_rl_exploration_screen
  status: adaptive

run:
  output_root: /workspace/artifacts-goalzendo/g00-rl-exploration-screen
  seeds: [9101]
  checkpoint_steps: [64]
  snapshot_steps: []

# This screen was specified after the frozen zero-entropy G00 trajectory showed
# near-deterministic A sampling and almost entirely zero leave-one-out
# advantages.  It is an adaptive engineering study, never confirmatory
# evidence.  The small evaluation banks make the three-way screen cheap while
# retaining the full factorial and matched causal endpoints.
data:
  n_train: 2000
  n_validation: 400
  n_eval_per_cell: 8
  rule_family: parity
  q_p: 0.95

train:
  algorithm: outcome_rl
  steps: 64
  batch_size: 10
  gradient_accumulation_steps: 5
  learning_rate: 0.000003
  samples_per_prompt: 4
  eval_steps: [0, 1, 2, 4, 8, 16, 32, 64]

evaluation:
  prompt_views: [full]
  causal_prompt_views: [full]
  causal_per_cell: 2
  final_causal_per_cell: 2
  final_eval_per_cell: 32
  batch_size: 32

cases:
  - train.entropy_coefficient: 0.01
  - train.entropy_coefficient: 0.10
  - train.entropy_coefficient: 1.00

sweep:
  data.rule_family: [parity]
  data.q_p: [0.95]
