extends: g00_capability_controls_1p5b.yaml

experiment:
  id: g00a
  name: adaptive_matched_accessibility_wave_b
  status: adaptive

run:
  output_root: /workspace/artifacts-goalzendo/g00a-matched-accessibility-wave-b
  seeds: [9001, 9002, 9003]
  # Wave B is intentionally fail-closed.  It may be unlocked only after the
  # complete Wave-A matched arm fails the unchanged per-seed, per-position
  # capability threshold.  A generic or unrelated G00 artifact is not an
  # authorization to run it.
  launch_guard: G00A_WAVE_B_REQUIRES_WAVE_A_MATCHED_NONPASS
  protocol_unlocked: false
  checkpoint_steps: [512]
  snapshot_steps: []

data:
  rule_family: parity
  training_view: audit_law_matched

train:
  algorithm: sft
  learning_rate: 0.00003
  batch_size: 10
  gradient_accumulation_steps: 4
  steps: 512
  warmup_ratio: 0.01171875
  eval_steps: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512]

evaluation:
  prompt_views: [audit_law_matched, law_only]

sweep: {}
cases: []
