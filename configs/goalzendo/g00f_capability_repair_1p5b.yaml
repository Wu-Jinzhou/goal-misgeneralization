extends: g00d_fixed_window_capability_1p5b.yaml

experiment:
  id: g00f
  name: capability_repair_1p5b
  status: prospective

run:
  output_root: /workspace/artifacts-goalzendo/g00f-capability-repair-1p5b
  seeds: [10103, 10111, 10133, 10139, 10141, 10151, 10159, 10163, 10169, 10177]
  # G00-F is a design-only protocol until an additive evaluator and an
  # independently reviewed execution manifest exist. The legacy G00 gate
  # failed and cannot unlock this nonempty guard.
  launch_guard: G00F_DESIGN_ONLY__FRESH_GATE_AND_EXECUTION_MANIFEST_REQUIRED
  protocol_unlocked: false
  checkpoint_steps: [1000]
  snapshot_steps: []

# The same singleton remediation is applied to both registered model sizes;
# the already stronger 1.5B panel is not treated as a substitute for 0.5B.
data:
  n_train: 10000
  n_validation: 1000
  n_eval_per_cell: 64

train:
  steps: 1000
  eval_steps: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1000]

evaluation:
  mirror_pairs: true
  final_eval_per_cell: 64

