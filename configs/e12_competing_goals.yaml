extends: base.yaml

experiment:
  hypothesis: h10
  name: competing_goal_frontier
  mode: calibrated_three_goal_competition

run:
  task_levels: [choice]
  save_checkpoints: false

evaluation:
  save_predictions: false

data:
  n_train: 10000
  n_validation: 4000
  n_eval: 10000
  max_k: 5
  state_dim: 8

model:
  depth: 2
  activation: relu
  residual: false

train:
  steps: 2048
  batch_size: 250
  learning_rate: 0.003
  weight_decay: 0.0
  eval_steps: log

h10:
  q_p: 0.90
  q_q: 0.95
  k_q: 2
  k_y: 3
  max_k_q: 3
  max_k_y: 5
  error_structure: independent
  calibration_steps: 2048
  mastery_threshold: 0.90

sweep:
  h10.q_p: [0.90, 0.99]
  h10.q_q: [0.90, 0.95, 0.99]
  h10.k_q: [2, 3]
  h10.k_y: [3, 5]
  model.width: [16, 64]
  h10.error_structure: [independent, nested]
